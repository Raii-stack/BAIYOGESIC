name: Auto Route PR to Test Branch

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  route-to-test:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.head_ref != 'test'
    steps:
      - name: Retarget PR to test
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Retargeting PR #$PR_NUMBER in $GH_REPO to base branch 'test'..."
          gh pr edit "$PR_NUMBER" --base test
          gh pr comment "$PR_NUMBER" --body "🤖 Automatically routed base branch from \`main\` to \`test\`."
