name: CI & Security Scanning

on:
  pull_request:
    branches:
      - main
      - test

jobs:
  # -------------------------------------------------------------
  # Acceptance Criteria 1 & 3: Testing, & Dependency Audit
  # -------------------------------------------------------------
  build-and-test:
    name: Build, Test & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit / Basic Tests
        run: npm test -- --passWithNoTests

      - name: Audit Dependencies for Critical CVEs
        run: npm audit --audit-level=critical

  # -------------------------------------------------------------
  # Acceptance Criteria 2: Secret Scanning
  # -------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog-actions-scan@main
        with:
          base: ${{ github.event.pull_request.base.ref }}
          head: ${{ github.event.pull_request.head.ref }}
          extra_args: --debug --only-verified
