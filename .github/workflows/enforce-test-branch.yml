name: Enforce Test Branch Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR originates from test branch
        run: |
          if [[ "${{ github.head_ref }}" != "test" ]]; then
            echo "Error: Direct PRs to main are not allowed. Please merge your feature into 'test' first."
            exit 1
          fi

      - name: Verify PR author is authorized
        run: |
          if [[ "${{ github.actor }}" != "Raii-stack" ]]; then
            echo "Error: Only repository owner (@Raii-stack) is authorized to open or promote pull requests to 'main'."
            exit 1
          fi
